name: Verify model

# Retrains the classifier from ml/data/ on every push and pull request and checks
# that the header compiled into the firmware still matches.
on:
  push:
    paths: ["ml/**", "firmware/Core/Inc/model_params.h", ".github/workflows/verify-model.yml"]
  pull_request:
    paths: ["ml/**", "firmware/Core/Inc/model_params.h", ".github/workflows/verify-model.yml"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ml/requirements.txt
      - run: bash ml/verify_model.sh
